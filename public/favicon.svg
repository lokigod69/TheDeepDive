<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background gradient - ocean depth -->
  <defs>
    <linearGradient id="oceanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90B8;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#2C5F7C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A0A0A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C8E1FF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8BB8D9;stop-opacity:0.4" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="32" height="32" rx="6" fill="url(#oceanGradient)"/>

  <!-- Surface waves - top -->
  <path d="M0,6 Q4,3 8,6 Q12,9 16,6 Q20,3 24,6 Q28,9 32,6 L32,0 L0,0 Z" fill="url(#waveGradient)" opacity="0.6"/>
  <path d="M0,8 Q5,5 10,8 Q15,11 20,8 Q25,5 32,8 L32,0 L0,0 Z" fill="url(#waveGradient)" opacity="0.3"/>

  <!-- Diver figure - simplified abstract form -->
  <g transform="translate(16, 17)">
    <!-- Head -->
    <circle cx="0" cy="-4" r="3" fill="#F0F0F0" opacity="0.9"/>
    <!-- Body diving down -->
    <path d="M0,-1 L0,6" stroke="#F0F0F0" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <!-- Arms reaching up (diving position) -->
    <path d="M-4,-3 Q-2,-1 0,0 Q2,-1 4,-3" stroke="#F0F0F0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>
    <!-- Legs -->
    <path d="M0,6 L-2,10 M0,6 L2,10" stroke="#F0F0F0" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Depth bubbles -->
  <circle cx="10" cy="12" r="1" fill="#C8E1FF" opacity="0.4"/>
  <circle cx="23" cy="16" r="0.8" fill="#C8E1FF" opacity="0.3"/>
  <circle cx="8" cy="20" r="0.6" fill="#C8E1FF" opacity="0.25"/>
</svg>
